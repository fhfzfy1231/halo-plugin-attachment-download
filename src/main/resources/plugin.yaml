# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: attachment-download
spec:
  enabled: true
  requires: ">=2.25.0"
  author:
    name: Akagi_Zen
    website: https://github.com/fhfzfy1231
  logo: logo.png
  homepage: https://github.com/fhfzfy1231/halo-plugin-attachment-download#readme
  repo: https://github.com/fhfzfy1231/halo-plugin-attachment-download
  issues: https://github.com/fhfzfy1231/halo-plugin-attachment-download/issues
  displayName: "附件下载"
  description: "为 Halo 默认编辑器提供可从附件库选择文件的下载按钮，避免 XML 等文件被浏览器直接预览。"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/fhfzfy1231/halo-plugin-attachment-download/blob/main/LICENSE"
